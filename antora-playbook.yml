site:
  title: Belgif REST Guidelines
  url: https://www.belgif.be/specification/rest
  start_page: api-guide::introduction.adoc
  robots: allow

content:
  sources:
    - url: .
      start_path: src/antora
      branches: HEAD
      edit_url: false # this doesn't work for local files currently, the edit-this-page.hbs file is overriden with an empty file instead

asciidoc:
  extensions:
    - ./src/antora/extensions/rule-block-extension.js

ui:
  bundle:
    url: ./ui-bundle.zip
  supplemental_files: ./src/supplemental-ui

output:
  clean: true
  dir: ./build/site
  destinations:
    - provider: archive
      path: ./build/site.zip
runtime:
  log:
    failure_level: error
