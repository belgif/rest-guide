# Maven continuous integration build of the guide
name: maven-ci-build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Temurin JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - name: Build with Maven
      run: mvn -B package
